[build]
  command = "npm run build:netlify"
  publish = "netlify-dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/orders"
  to = "/.netlify/functions/orders"
  status = 200

[[redirects]]
  from = "/api/stores"
  to = "/.netlify/functions/stores"
  status = 200

[[redirects]]
  from = "/api/reservations"
  to = "/.netlify/functions/reservations"
  status = 200

[[redirects]]
  from = "/api/reviews"
  to = "/.netlify/functions/reviews"
  status = 200

[[redirects]]
  from = "/api/ai-menu"
  to = "/.netlify/functions/ai-menu"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
