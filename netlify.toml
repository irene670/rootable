[build]
  command = "npm run build:netlify"
  publish = "netlify-dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/orders"
  to = "/.netlify/functions/orders"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
